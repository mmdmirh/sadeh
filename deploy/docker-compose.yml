networks:
  app_network:
    driver: bridge

services:
  mysql:
    networks:
      - app_network
    image: mysql:8.0
    container_name: local-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-sadeh_root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sadeh_db}
      MYSQL_USER: ${MYSQL_USER:-sadeh_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-sadeh_password}
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
      MYSQL_DEFAULT_AUTHENTICATION_PLUGIN: mysql_native_password
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/initdb.d:/docker-entrypoint-initdb.d
    command: 
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max_allowed_packet=128M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-sadeh_root_password}"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  # === Ollama Service ===
  ollama:
    image: ollama/ollama:latest
    container_name: local-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
      - ./ollama_config/ollama_entrypoint.sh:/app/ollama_entrypoint.sh
    restart: unless-stopped
    entrypoint: ["/app/ollama_entrypoint.sh"]
    dns:
      - 8.8.8.8
      - 8.8.4.4
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "exit 0"]
      interval: 10s
      timeout: 2s
      retries: 3
      start_period: 5s

# --- Web Service ---
  web:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: ai-chat-web
    restart: unless-stopped

    mem_limit: 1g
    mem_reservation: 512m
    memswap_limit: 2g
    shm_size: 256m
    ports:
      - "5001:5001"
    depends_on:
      mysql:
        condition: service_healthy
      ollama:
        condition: service_healthy
    networks:
      - app_network
    env_file:
      - ./.env

volumes:
  mysql-data:
  ollama-models: