networks:
  app_network:
    driver: bridge

services:
  mysql:
    networks:
      - app_network
    image: mysql:8.0
    container_name: local-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-my-secret-pw}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-your_database_name}
      MYSQL_USER: ${MYSQL_USER:-your_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-your_password}
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command: ["--default-authentication-plugin=mysql_native_password"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  # === Ollama Service ===
  ollama:
    image: ollama/ollama:latest
    container_name: local-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
      - ./ollama_config/ollama_entrypoint.sh:/app/ollama_entrypoint.sh
    restart: unless-stopped
    entrypoint: ["/app/ollama_entrypoint.sh"]
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "exit 0"]
      interval: 10s
      timeout: 2s
      retries: 3
      start_period: 5s

# --- Web Service ---
  web:
    image: mmdmirh/sadeh-app:latest
    container_name: ai-chat-web
    restart: unless-stopped
    build:
      context: ..
      dockerfile: Dockerfile
    mem_limit: 1g
    mem_reservation: 512m
    memswap_limit: 2g
    shm_size: 256m
    ports:
      - "5001:5001"
    depends_on:
      mysql:
        condition: service_healthy
      ollama:
        condition: service_healthy
    networks:
      - app_network
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=development
      - SECRET_KEY=a-very-secret-key-change-me
      - MYSQL_USER=your_user
      - MYSQL_PASSWORD=your_password
      - MYSQL_DATABASE=your_database_name
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-my-secret-pw}
      - LLM_SERVICE=ollama
      - DOCKER_ENV=true
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODELS=gemma3:1b,tinyllama:1.1b-chat-v1-q2_K,llama2:latest
      - ADMIN_USERNAME=admin@example.com
      - ADMIN_PASSWORD=your_secure_password
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
volumes:
  mysql-data:
  ollama-models: