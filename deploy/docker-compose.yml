networks:
  app_network:
    driver: bridge

services:
  mysql:
    networks:
      - app_network
    image: mysql:8.0
    container_name: local-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-sadeh_root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sadeh_db}
      MYSQL_USER: ${MYSQL_USER:-sadeh_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-sadeh_password}
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
      MYSQL_DEFAULT_AUTHENTICATION_PLUGIN: mysql_native_password
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/initdb.d:/docker-entrypoint-initdb.d
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max_allowed_packet=128M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  ollama:
    image: ollama/ollama:latest
    container_name: local-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
      - ./ollama_config/ollama_entrypoint.sh:/app/ollama_entrypoint.sh
    restart: unless-stopped
    entrypoint: ["/app/ollama_entrypoint.sh"]

    networks:
      - app_network
    healthcheck:
      test: ["CMD", "/usr/bin/ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  app:
    networks:
      - app_network
    build:
      context: ..
      dockerfile: ./deploy/Dockerfile
    container_name: ai-chat-web
    deploy:
      resources:
        limits:
          memory: 2g
    restart: always
    ports:
      - "5001:5001"
    volumes:
      - ../rag_documents:/home/app/rag_documents
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-sadeh_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-sadeh_password}
      MYSQL_DB: ${MYSQL_DATABASE:-sadeh_db}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://ollama:11434}
    command: /home/app/deploy/wait-for-db.sh gunicorn --bind 0.0.0.0:5001 --timeout 180 --workers 1 app:app
    depends_on:
      mysql:
        condition: service_healthy
      ollama:
        condition: service_healthy
    env_file:
      - ./.env

volumes:
  mysql-data:
  ollama-models: